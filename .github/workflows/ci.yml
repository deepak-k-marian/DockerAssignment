name: FastAPI Docker CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the codebase onto the GitHub runner environment
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Build the Alpine Docker image matching your local setup
    - name: Build Docker Image
      run: |
        docker build -t fastapi-email-app .

    # 3. Launch the container instance in background detached mode
    # Note: These are safe dummy strings so Pydantic doesn't throw a validation error on boot
    - name: Start Application Container
      run: |
        docker run -d \
          -p 8000:8000 \
          -e SENDER_EMAIL="sandbox_test@gmail.com" \
          -e SENDER_PASSWORD="dummypassword1234" \
          --name assignment-container \
          fastapi-email-app

    # 4. Wait a few moments for Python and Uvicorn to initialize internal modules
    - name: Settle Server Execution
      run: sleep 5

    # 5. Check if the container is still alive and print the FastAPI startup logs
    - name: Verify Startup Logs & Application Health
      run: |
        # Check if the container crashed or is running
        CONTAINER_STATUS=$(docker inspect -f '{{.State.Running}}' assignment-container)
        echo "Is container actively running? $CONTAINER_STATUS"
        
        # Print out the explicit FastAPI and Uvicorn startup logs to the action runner console
        echo "=== Current FastAPI Server Logs ==="
        docker logs assignment-container
        echo "==================================="
        
        # Fail the pipeline cleanly if the container is dead
        if [ "$CONTAINER_STATUS" != "true" ]; then
          echo "❌ Error: The container crashed on startup!"
          exit 1
        fi
        
        echo "✅ Success: FastAPI container successfully initialized and booted up!"