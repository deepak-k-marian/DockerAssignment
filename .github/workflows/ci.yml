name: FastAPI Docker CI

# Trigger this workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone your repository onto the GitHub runner machine
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Build your custom Alpine-based Docker image
    - name: Build Docker Image
      run: |
        docker build -t fastapi-email-app .

    # Step 3: Run the container in detached background mode
    # Note: We pass dummy environment secrets so your Pydantic app configurations don't crash
    - name: Launch Application Container
      run: |
        docker run -d \
          -p 8000:8000 \
          -e SENDER_EMAIL="test@example.com" \
          -e SENDER_PASSWORD="dummypassword1234" \
          --name test-container \
          fastapi-email-app

    # Replace step 4 and 5 in sinle step
    - name: Verify API Response (Health Check)
      run: |
        echo "Waiting for FastAPI container to wake up..."
        
        # Loop up to 6 times (30 seconds total) checking for connectivity
        for i in {1..6}; do
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || echo "000")
          echo "Attempt $i: Server responded with status code $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Success: FastAPI Container is fully functional!"
            exit 0
          fi
          
          echo "Server not ready yet. Retrying in 5 seconds..."
          sleep 5
        done

        echo "❌ Error: API failed to respond with Status 200 within 30 seconds"
        exit 1


    # Step 5: Print out container runtime logs if anything fails (For debugging)
    - name: Inspect Container Logs on Failure
      if: failure()
      run: |
        docker logs test-container